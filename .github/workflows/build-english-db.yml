name: Build English Database

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout marble-tools
        uses: actions/checkout@v4

      - name: Install Node and NPM
        uses: actions/setup-node@v4
        with:
          node-version-file: 'package.json'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # Runs after npm ci so dependency install scripts can't read the token that git clone
      # stores in the cloned repos' .git/config
      - name: Clone private repositories
        run: |
          git clone https://${{ secrets.MARBLE_REPO_TOKEN }}@github.com/ubsicap/marble-lexicon.git ../marble-lexicon

      - name: Convert SDBG lexicon
        id: convert-sdbg
        run: npm run convert-sdbg

      - name: Convert SDBH lexicon
        id: convert-sdbh
        run: npm run convert-sdbh

      - name: Create English directory and copy files
        run: |
          mkdir -p english
          cp output-sdbg/lexicon_en.xml english/sdbg_en.xml
          cp output-sdbh/lexicon_en.xml english/sdbh_en.xml

      - name: Import to SQLite
        id: import
        run: npm run import-english-to-sqlite

      - name: Download the published English database
        run: |
          mkdir -p previous-db
          # media.githubusercontent.com serves the Git LFS object; raw.githubusercontent.com would return the LFS pointer.
          curl -fsSL -o previous-db/lexical.db.xz https://media.githubusercontent.com/media/paranext/dependencies/main/lexical-db/lexical.db.xz
          xz -d previous-db/lexical.db.xz

      - name: Verify English database
        id: verify
        run: python3 scripts/verify_english_db.py --db english.db --lexicon ../marble-lexicon --previous-db previous-db/lexical.db

      - name: Upload English database
        uses: actions/upload-artifact@v4
        with:
          name: english-database
          path: english.db
          retention-days: 90

      # A database that failed a step is kept for investigation under a name that says so. Only the
      # steps that produce or check the database count: a failed upload is not a failed database.
      - name: Upload unverified English database
        if: always() && (steps.convert-sdbg.outcome == 'failure' || steps.convert-sdbh.outcome == 'failure' || steps.import.outcome == 'failure' || steps.verify.outcome == 'failure')
        uses: actions/upload-artifact@v4
        with:
          name: english-database-unverified
          path: english.db
          if-no-files-found: ignore
          retention-days: 90

      # The XML of a run that failed a step is named so, like its database
      - name: Upload XML files
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ (steps.convert-sdbg.outcome == 'failure' || steps.convert-sdbh.outcome == 'failure' || steps.import.outcome == 'failure' || steps.verify.outcome == 'failure') && 'xml-files-unverified' || 'xml-files' }}
          path: |
            output-sdbg/*.xml
            output-sdbh/*.xml
          retention-days: 90
